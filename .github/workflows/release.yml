name: Release

# Pushing a tag like v0.2.0 builds each system's package and publishes them, each with its SHA-256,
# as one GitHub release: as ArtCraft's release workflow does, every build uploads its files and a
# last job publishes them together. Installed copies of Splicr find their package there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            targets: ""
          - os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
          # Ubuntu 22.04's glibc is the oldest the deb asks for, as ArtCraft builds it.
          - os: ubuntu-22.04
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: target/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # Each package gets its ed25519 signature, which the updater checks: copies out there accept
      # only packages signed with the project's key. `sign` refuses a key the updater doesn't have.
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign the packages
        env:
          SPLICR_SIGNING_KEY: ${{ secrets.SPLICR_SIGNING_KEY }}
        run: cargo xtask sign dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Splicr ${GITHUB_REF_NAME#v}" --generate-notes
